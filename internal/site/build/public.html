<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1769e0" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="canonical" href="{{.CanonicalURL}}" />
    <title>{{.Title}} · Offline Notepad</title>
    <script type="module" crossorigin src="/static/public-0JsDjAmx.js"></script>
    <link rel="modulepreload" crossorigin href="/static/analytics-B5Rx0mbl.js">
    <link rel="stylesheet" crossorigin href="/static/public-CGExCnbx.css">
  <link rel="manifest" href="/manifest.webmanifest"></head>
  <body>
    <header class="public-header">
      <a href="/" class="public-brand"><span aria-hidden="true">N</span> Offline Notepad</a>
      <a href="{{.RawURL}}" class="raw-link">View raw</a>
    </header>
    <main class="public-note">
      <p class="eyebrow">Shared snapshot</p>
      <h1>{{.Title}}</h1>
      <article>{{.Content}}</article>
    </main>
    <footer>Published as a read-only snapshot. Later private edits are not shown here.</footer>
  </body>
</html>
