name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: offlinenotepad
          POSTGRES_PASSWORD: offlinenotepad
          POSTGRES_DB: offlinenotepad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offlinenotepad -d offlinenotepad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://offlinenotepad:offlinenotepad@127.0.0.1:5432/offlinenotepad_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.8
          cache: true
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Type-check and test frontend
        run: |
          npm --prefix web run lint
          npm --prefix web run typecheck
          npm --prefix web test
      - name: Build embedded frontend
        run: npm --prefix web run build
      - name: Install browser test runtime
        run: npx --prefix web playwright install --with-deps chromium
      - name: Run browser scenarios
        run: npm --prefix web run test:e2e
      - name: Verify generated SQL
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/database/postgresdb internal/database/sqlitedb
      - name: Vet and test Go
        run: |
          go vet ./...
          go test -race ./...
      - name: Verify production binary
        run: |
          test -f internal/site/build/index.html
          CGO_ENABLED=0 go build -trimpath -o /tmp/offlinenotepad ./cmd/offlinenotepad

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: offlinenotepad:test
